# Configuration PyCalendar - Handball avec CP-SAT
# ====================================
# Seules les valeurs différentes des défauts sont spécifiées

# Fichiers
fichiers:
  donnees: "data/volleyball/config_volley.xlsx"
  sortie: "data/volleyball/calendrier_volley.xlsx"

# Paramètres de planification (seulement valeurs différentes des défauts)
planification:
  semaine_min: 9    # Défaut: 1 - Commence la planification à la semaine 2
  nb_semaines: 13
  strategie: "cpsat"  # Défaut: "greedy" - Force l'utilisation de CP-SAT


# Configuration CP-SAT (OR-Tools)
cpsat:
  temps_max_secondes: 400    # Minimum ~45-60s needed to find feasible solution for 267 matches
  warm_start: false  # Disabled: causes issues with solver status
  warm_start_file: "volley"  # Solutions spécifiques au volley

contraintes:
  compaction_penalites_par_semaine: [0, 0, 5, 0, 3, 3, 3, 3, 3, 3, 3, 3, 3]
  
  # Adéquation niveau match / niveau gymnase
  # Convention: valeurs NÉGATIVES = bonus (réduction coût), POSITIVES = pénalité (augmentation coût)
  # Exemple: A1 (haut niveau) sur gymnase haut niveau → bonus (valeur négative)
  #          A1 (haut niveau) sur gymnase bas niveau → pénalité (valeur positive)
  penalite_niveau_gymnases_haut: [-5, -3, -1, 0]  # [A1, A2, A3, A4] sur gymnase HAUT niveau (valeurs négatives = bonus)
  penalite_niveau_gymnases_bas: [8, 5, 2, 1]  # [A1, A2, A3, A4] sur gymnase BAS niveau (valeurs positives = pénalité)


calendrier:
  actif: true
  date_debut: "2025-10-09"  # Date de début de saison (premier jour possible pour les matchs)
  jour_match: "jeudi"  # Jour de la semaine où se déroulent les matchs
  semaines_banalisees: [3, 10, 11, 12]  # Liste des numéros de semaines banalisées (vacances, périodes sans match)

# Paramètres spécifiques au volley
sport:
  duree_match_minutes: 120  # Durée d'un match de volley = 2h
