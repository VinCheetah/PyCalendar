# Configuration PyCalendar - Volleyball
# =====================================
# Seules les valeurs différentes des défauts sont spécifiées

# Fichiers
fichiers:
  donnees: "data/volleyball/config_volley.xlsx"
  sortie: "data/volleyball/calendrier_volley.xlsx"

# Paramètres de planification (seulement valeurs différentes des défauts)
planification:
  semaine_min: 1     # Première semaine où le planificateur peut poser de nouveaux matchs
  nb_semaines: 13    # Nombre total de semaines de compétition (calendrier: semaine 1 à 13)


# Configuration CP-SAT (OR-Tools)
cpsat:
  temps_max_secondes: 400    # Minimum ~45-60s needed to find feasible solution for 267 matches
  warm_start: false  # Disabled: causes issues with solver status
  warm_start_file: "volley"  # Solutions spécifiques au volley

contraintes:
  compaction_penalites_par_semaine: [0, 0, 5, 0, 3, 3, 3, 3, 3, 3, 3, 3, 3]
  

calendrier:
  actif: true
  date_debut: "2025-10-13"  # Date de début de saison (premier jour possible pour les matchs)
  jour_match: "jeudi"  # Jour de la semaine où se déroulent les matchs
  semaines_banalisees: [3, 10, 11, 12]  # Liste des numéros de semaines banalisées (vacances, périodes sans match)

# Configuration du sport
# Utilise les préréglages du volleyball depuis sports_presets.yaml
sport:
  type: "volleyball"              # Charge automatiquement les paramètres du volleyball
  duree_match_minutes: 120        # Surcharge: 2h par match de volley
