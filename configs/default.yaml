# Configuration par défaut pour PyCalendar
# =========================================
# Ce fichier contient TOUTES les valeurs par défaut
# Les valeurs ici doivent correspondre exactement aux défauts dans core/config.py
#
# Pour créer une config personnalisée, copiez ce fichier et ne gardez que les valeurs
# que vous souhaitez modifier. Les autres seront automatiquement héritées des défauts.

# Fichiers d'entrée et de sortie
fichiers:
  donnees: "data/volleyball/config_volley.xlsx"
  sortie: "data/volleyball/calendrier_volley.xlsx"

# Paramètres de planification
planification:
  nb_semaines: 11    # Nombre total de semaines de compétition (calendrier: semaine 1 à nb_semaines)
  semaine_min: 1     # Première semaine où le planificateur peut poser de nouveaux matchs

# Configuration CP-SAT (OR-Tools - recherche solution optimale)
cpsat:
  temps_max_secondes: 120  # Temps maximum de résolution (minimum recommandé pour problèmes complexes)
  afficher_progression: false  # Afficher les détails du solver pendant la résolution
  warm_start: true  # Utiliser la solution précédente comme point de départ
  warm_start_file: "volley"  # Nom du fichier pour sauvegarder/charger les solutions de démarrage
  use_prefilter: true  # Si true: préfiltre les combinaisons impossibles avant création des variables (plus rapide)
  
  # Paramètres avancés du solver OR-Tools
  num_search_workers: 8  # Nombre de threads pour la recherche parallèle (0 = auto)
  relative_gap_limit: 0.0  # Limite d'écart relatif (0 = continuer jusqu'au timeout)
  absolute_gap_limit: 0.0  # Limite d'écart absolu (0 = continuer jusqu'au timeout)
  
  # ============================================================================
  # MODE PERFORMANCE - Contrôle la complexité du modèle
  # ============================================================================
  # Mode "fast" désactive automatiquement les contraintes les plus coûteuses
  # pour accélérer la résolution. Utile pour tests rapides ou problèmes simples.
  # Les flags individuels ci-dessous permettent un contrôle fin.
  mode_fast: false  # Si true: désactive automatiquement les contraintes coûteuses
  
  # Flags individuels pour les contraintes COÛTEUSES EN CALCUL
  # Ces flags permettent de désactiver sélectivement les contraintes les plus lourdes
  # ⚠️ IMPACT PERFORMANCE: désactiver = plus rapide, mais solution potentiellement moins bonne
  
  # 🔴 CRITIQUE: Espacement repos inter-matchs (O(équipes × semaines²))
  # Crée ~3 variables auxiliaires par paire de semaines par équipe
  # Exemple: 50 équipes × 13 semaines² = ~25,000 variables
  enable_espacement_repos: true
  
  # 🔴 CRITIQUE: Espacement aller-retour (O(paires × créneaux²)) 
  # Crée 1 variable par combinaison (aller_creneau, retour_creneau)
  # Exemple: 100 paires × 200² créneaux = potentiellement millions de comparaisons
  enable_aller_retour_espacement: false
  
  # 🟠 ÉLEVÉ: Mode simplifié pour espacement repos
  # Au lieu de pénaliser chaque paire de semaines, pénalise seulement les semaines consécutives
  # Réduit la complexité de O(semaines²) à O(semaines)
  espacement_repos_simplifie: false
  
  # 🟠 ÉLEVÉ: Mode simplifié pour aller-retour
  # Au lieu de pénaliser chaque paire de créneaux, utilise une formulation agrégée par semaine
  # Réduit la complexité de O(créneaux²) à O(semaines²)
  aller_retour_simplifie: false

# Contraintes
contraintes:
  # --- Préférences de gymnase ---
  # Système de bonus par rang : si une équipe obtient son gymnase préféré de rang N,
  # elle reçoit une réduction de pénalité de bonus_preferences_gymnases[N]
  # Plus la valeur est haute, plus le gymnase de ce rang est favorisé
  bonus_preferences_gymnases: [10.0, 8.0, 5.0, 2.0, 1.0]

  # --- Pondérations globales des gymnases par niveau ---
  # Ces valeurs sont AJOUTÉES à l'objectif (négatif = encourage, positif = décourage)
  # Index = niveau du match (0=A1, 1=A2, 2=A3, 3=A4)
  # poids_niveaux_gymnases_haut: bonus/malus quand le match est dans un gymnase "haut niveau"
  # poids_niveaux_gymnases_bas: bonus/malus quand le match est dans un gymnase "bas niveau"
  # 
  # Exemple: match A1 (index 0) dans gymnase haut niveau → poids_haut[0] = -6 (bonus de 6)
  #          match A1 (index 0) dans gymnase bas niveau → poids_bas[0] = 30 (pénalité de 30)
  poids_niveaux_gymnases_haut: [-6, -4, -2, 0]  # A1/A2 encouragés en gym haut, A4 neutre
  poids_niveaux_gymnases_bas: [30, 12, 4, 1]   # A1 très découragé en gym bas, A4 toléré
  penalite_gymnase_priorite_genre: 15.0  # Pénalité si un gymnase prioritaire M/F reçoit un match du genre opposé

  # --- Horaires préférés avec système de tolérance ---
  # Formule: pénalité = multiplicateur × ((distance / diviseur)²)
  # Distance calculée uniquement si > tolérance
  penalite_apres_horaire_min: 1.0  # Multiplicateur si match APRÈS horaire préféré
  penalite_avant_horaire_min: 6.0  # Multiplicateur si match AVANT horaire d'une seule équipe
  penalite_avant_horaire_min_deux: 15.0  # Multiplicateur si match AVANT horaire des deux équipes
  penalite_horaire_diviseur: 60.0  # Diviseur pour normaliser la distance en minutes
  penalite_horaire_tolerance: 30.0  # Fenêtre de tolérance en minutes sans pénalité
  
  # Interdiction stricte de jouer AVANT l'horaire préféré (contrainte dure optionnelle)
  # Utile pour déblocage rapide de planifications où jouer avant est impossible
  # (équipes en cours, au travail, etc.)
  horaire_avant_interdit: true  # Si true: INTERDIT les matchs avant horaire préféré
  horaire_avant_tolerance: 30  # Tolérance en minutes (0 = strict, 30 = accepte 30min avant)

  # --- Limites strictes ---
  max_matchs_par_equipe_par_semaine: 1  # Maximum de matchs qu'une équipe peut jouer par semaine

  # --- Espacement entre matchs d'une même équipe ---
  # Liste de pénalités indexées par nombre de semaines de repos
  # Index 0 = matchs consécutifs (0 semaine de repos)
  # Index 1 = 1 semaine d'écart entre matchs
  # Index 2 = 2 semaines d'écart, etc.
  # Si repos >= longueur liste, pénalité = 0
  penalites_espacement_repos: [25.0, 16.0, 9.0, 5.0, 2.0]

  # --- Compaction temporelle ---
  # Pénalise les matchs planifiés tard dans la saison pour favoriser planification précoce
  compaction_temporelle_actif: true
  compaction_penalites_par_semaine: []  # Index = semaine - 1

  # --- Overlaps institution ---
  # Évite que plusieurs matchs d'un même groupe jouent simultanément (même semaine + horaire)
  # Nécessite la configuration de groupes dans la feuille Excel 'Groupes_Non_Simultaneite'
  # Exemple: groupe "Paris" avec institutions ["Paris 1", "Paris 2", "Paris 3"]
  #   → si "Paris 1 vs Lyon" et "Paris 2 vs Marseille" sont simultanés, pénalité appliquée
  # Si aucun groupe configuré: contrainte automatiquement désactivée (message de warning)
  overlap_institution_actif: false  # Activer/désactiver cette contrainte
  overlap_institution_poids: 10.0  # Pénalité par chevauchement détecté (recommandé: 10-100)
  coach_overlap_actif: false
  coach_overlap_penalite_simultane_diff_gym: 20.0
  coach_overlap_penalite_simultane_meme_gym: 2.0
  coach_overlap_penalite_deplacement: 8.0
  coach_overlap_bonus_consecutif: 5.0
  coach_overlap_simultane_minutes: 60
  coach_overlap_consecutif_min_minutes: 60
  coach_overlap_consecutif_max_minutes: 180
  coach_overlap_semaine_min: 1

  # --- Équilibrage des matchs (système max-min avec bonus progressif) ---
  # Garantit que le minimum de matchs par équipe soit maximal
  # Utilise des bonus dégressifs: 1er match = bonus élevé, 2ème = bonus/2, 3ème = bonus/4, etc.
  # ⚠️ PERFORMANCE: Le mode avec ententes est O(équipes × seuils × ententes) - très coûteux
  equilibrage_actif: true
  equilibrage_bonus_base: 500000.0  # Bonus pour le premier match d'une équipe
  equilibrage_facteur_decroissance: 0.7  # Facteur multiplicatif pour chaque match suivant
  equilibrage_bonus_minimum: 1.0  # Bonus plancher
  equilibrage_mode_simplifie: false  # Si true: mode simplifié O(équipes × seuils) sans gestion fine des ententes

  # --- Ententes (matchs entre institutions spécifiques) ---
  # Les ententes sont des matchs gérés par les équipes (sans créneau assigné)
  # Utilisées comme "soupape de sécurité" quand le calendrier est saturé
  entente_actif: false
  entente_facteur_reduction_bonus: 0.6  # Réduction multiplicative du bonus total de l'équipe par entente (0.90 = -10% par entente)

  # --- Contraintes temporelles (CFE, phases de poules, etc.) ---
  # Permet de forcer certains matchs avant/après une semaine donnée
  contrainte_temporelle_actif: true
  contrainte_temporelle_penalite: 100.0  # Pénalité si contrainte violée
  contrainte_temporelle_dure: false  # Si true: bloquant, si false: simple pénalité

  # --- Espacement aller-retour ---
  # Force un espacement minimum entre matchs aller et retour (poules Aller-Retour uniquement)
  aller_retour_espacement_actif: true
  aller_retour_penalites_par_ecart: [5000.0, 2000.0, 500.0, 200.0, 50, 10]  # Pénalités supplémentaires par écart en semaines (index = écart)
  aller_retour_bonus_retour: 0.85  # Ratio appliqué au bonus pour les matchs retours (1.0 = pas de réduction)

# Gestion du calendrier avec dates réelles
calendrier:
  actif: true  # Activer pour afficher dates réelles au lieu de numéros de semaine
  date_debut: "2025-10-13"  # Date de début de saison (format YYYY-MM-DD)
  jour_match: "jeudi"  # Jour de la semaine des matchs
  semaines_banalisees: []  # Liste des semaines banalisées (vacances, pas de matchs)

# Paramètres spécifiques au sport
# ================================
# Utilisez 'type' ou 'preset' pour charger les paramètres prédéfinis d'un sport.
# Les valeurs prédéfinies sont dans configs/sports_presets.yaml
# Vous pouvez surcharger n'importe quel paramètre individuellement.
#
# Sports supportés: volleyball, handball, basketball, football, futsal, rugby, badminton, tennis_table
# Alias acceptés: volley/VB, hand/HB, basket/BB, foot/FB, FS, RG, BD, TT
sport:
  type: "volleyball"                    # Type de sport (charge les préréglages)
  # prefix: "VB"                        # Préfixe dans les codes de poule (auto depuis type)
  # name: "Volleyball"                  # Nom complet (auto depuis type)
  # name_short: "Volley"                # Nom court (auto depuis type)
  # emoji: "🏐"                         # Emoji du sport (auto depuis type)
  # duree_match_minutes: 120              # Durée d'un match (peut surcharger le preset)
  # duree_entre_matchs_minutes: 15      # Temps entre deux matchs
  # score_format: "sets"                # Format des scores: "sets" ou "points"
  # niveaux: ["A1", "A2", "A3", "A4"]   # Niveaux disponibles
  # genres: ["M", "F"]                  # Genres: M(asculin), F(éminin), X(mixte)
  # types_championnat: ["Acad", "CFE", "CFU"]  # Types de compétition

