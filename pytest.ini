[pytest]
# Configuration pytest pour PyCalendar

# Dossiers à chercher pour les tests
testpaths = tests

# Pattern de fichiers de test
python_files = test_*.py

# Pattern de classes de test
python_classes = Test*

# Pattern de fonctions de test
python_functions = test_*

# Options par défaut
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Markers personnalisés
markers =
    slow: Tests lents (nécessitent plus de temps)
    integration: Tests d'intégration (lancent CP-SAT)
    unit: Tests unitaires (fonctions isolées)
    real_data: Tests sur données réelles (volleyball, handball, etc.)

# Configuration du logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Ignorer certains warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
